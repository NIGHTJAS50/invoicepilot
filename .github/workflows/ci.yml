name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Scan dependencies and source
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build Java sources for CodeQL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/codeql-classes | Out-Null
          $sources = (Get-ChildItem -Recurse -File src/main/java -Filter *.java).FullName
          javac -d out/codeql-classes $sources
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
      - name: Build container
        run: docker build --tag invoicepilot:ci .